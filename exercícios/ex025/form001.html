<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <!-- formulário da forma mais simples 
     este jeito não está 100% bem -->

     <!-- todo formulário ele tem que tá dentro da tag <form> e </form> -->

    <h1>Meu primeiro formulário</h1>

    <form action="cadastro.php" method="post" autocomplete="off">
        <!-- method=get - é o modo padrão, devo usar quando os dados não forem sensíveis por exemplo: nome, peso, idade,envios de fotos - e também o dado inteiro do formulário não pode ultrapassar mais de 3000bytes = 3000letras - se passar use o post -->

        <!-- method=post - para esconder os dados do usuário da url, mas não está protegido, dar pra ver de uma outra maneira - devo usar para dados sensíveis como: senha, números de cartão de crédito,  -->

        <!-- action - para enviar um dado de um formulário - o botão de submit vai fazer o resto do trabalho -->

        <!-- autocomplete=off - para tirar as sugestões de texto  -->

        <!-- pra fazer a caixinha é só usar a tag input-text -->

        <p><label for="inome">Nome:</label> <input type="text" name="nome" id="inome"></p>

        <!-- IMPORTANTE! - USAR SEMPRE 'LABEL' PARA FORMULÁRIOS
         'LABEL' É PARA CRIAR UMA RELAÇÃO PARA A CAIXINHA DO FORMULÁRIO - ajuda na experiência do usuário durante a utilização e preenchimento do formulário -->

        <!-- dentro do 'for' sempre vai o ID -->

        <p><label for="isobrenome">Sobrenome:</label> <input type="text" name="sobrenome" id="isobrenome"></p>

        <p><input type="submit" value="Enviar"></p>

        <!-- pra fazer o botão de ENVIAR usamos a tag input-submit -->

    </form>

</body>
</html>
