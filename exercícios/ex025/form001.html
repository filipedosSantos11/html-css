<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <!-- formulário da forma mais simples 
     este jeito não está 100% bem -->

     <!-- todo formulário ele tem que tá dentro da tag <form> e </form> -->

    <h1>Meu primeiro formulário</h1>

    <form>
        <!-- pra fazer a caixinha é só usar a tag input-text -->

        <p>Nome: <input type="text" name="nome" id="nome"></p>
        <p>Sobrenome: <input type="text" name="sobrenome" id="sobrenome"></p>

        <p><input type="submit" value="Enviar"></p>

        <!-- pra fazer o botão de ENVIAR usamos a tag input-submit -->

    </form>

</body>
</html>
