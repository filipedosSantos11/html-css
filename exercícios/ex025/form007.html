<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iest">Estado</label>
            <select name="Estado" id="iest">
                <!-- SELECT - é para criar listas suspensas, ou menu de opções - permite que o usuário selecione um ou mais itens de uma lista definida previamente -->

                <option value="" selected>--- Escolha ---</option>
                <!-- SELECTED - serve para deixar uma opção previamente selecionada -->

                <optgroup label="Região Sudeste">
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>
                </optgroup>

                <optgroup label="Região Nordeste">
                    <!-- OPTGROUP - é usado para agrupar <option>
                    ele cria grupos lógicos facilitando a seleção -->
                    
                    <option value="MA">Maranhão</option>
                    <option value="PE">Pernambuco</option>
                    <option value="RN">Rio Grande do Norte</option>
                </optgroup>

                 <!-- OPTION - define uma opção em uma lista de seleção -->
            </select>
        </p>

        <p>
            <label for="iprof">Profissão: </label>
            <input type="text" name="prof" id="iprof" list="lstprof">
            <datalist id="lstprof">
                <!-- <DATALIST> - É uma maneira de fornecer uma lista de opções aos usuários quando eles preenchem um formulário -->

                <option>Administrador</option>
                <option>Contabilista</option>
                <option>Desenvolvedor</option>
                <option>Professor</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">Mensagem: </label><br>
            <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>

            <!-- <TEXTAREA - cria uma área de texto, é usado também para comentários ou avaliações -->

            <!-- com isso passou de 3000bytes se usa o METHOD=POST -->
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
