<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" required maxlength="30" placeholder="Nome completo" autocomplete="name">
        </p>

        <p>
            <label for="imedia">Média</label>
            <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1" value="5" required>

            <!-- VALUE - para aparecer um número já preenchido -->
            
            <!-- STEP - para poder acrescentar números com vírgula -->

            <!-- é MIN e MAX - e não minlength e maxlength -->

            <!-- input:number - para aceitar somente números -->
        </p>

        <p>
            <label for="imes">Período Letivo</label>
            <input type="month" name="mes" value="2024-07" id="imes">

            <!-- VALUE - também pode ser aplicado aki, indicando o ano e o mês respectivamente -->

            <!-- INPUT:MONTH - para poder pesquisar o período letivo  -->
        </p>

        <p>
            <label for="idia">Dia da Prova</label>
            <input type="date" name="dia" id="idia" value="2024-07-14">

            <!-- INPUT:DATE - para criar o campo de datas -->

            <!-- VALUE - vai ser feito em javaScript -->
        </p>

        <p>
            <label for="ihora">Horário da Prova</label>
            <input type="time" name="hora" id="ihora">

            <!-- INPUT:TIME - para criar o campa de hora -->
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">

            <!-- input-reset - para criar o botão de limpar -->
        </p>
    </form>
</body>
</html>
