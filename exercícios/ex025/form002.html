<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>teste de formulário</h1>

    <form action="cadastro.php" method="post" autocomplete="on">
      <p>
        <label for="iusu">Usuario:</label>
        <input type="text" name="usu" id="iusu" required minlength="5" maxlength="30" size="10" placeholder="nome do usuário" autocomplete="username">
      </p>

      <!-- AUTOCOMPLETE EM UNPUT:TEX - são as sugestões para preencher o formulário - primeiramente tem colocar autocomplete='on' em <FORM>

            usuário = USERNAME - para expecíficar que aquela caixinha é de usuário 

            senha atual = CURRENT-PASSWORD - para expecíficar que a caixinha é de senha 
            -->

      <!-- placeholder - serve como uma dica do que o usuário tem que colocar no formulário -->

      <!-- size - é quantas letras a caixinha vai mostrar por vez - não vai limitar nada - ele criar uma rolagem lateral -->

      <!-- minlength - para o mínimo de 5 letras - tem que ter pelo menos 5 caractéris para usuário -->

       <!-- maxlength - para o máximo de 15 letras - tem que ter no máximo 15 caractéris para o usuário  -->

      <!-- required - para exibir a mensagem, quando o usuário e senha estiverem vazios -->

      <p>
        <label for="isen">Senha:</label>
        <input type="password" name="sen" id="isen" required minlength="8" maxlength="20" size="8" placeholder="mínimo 8 caractéris" autocomplete="current-password">

        <!-- minlength - para o mínimo de 8 letras - tem que ter pelos menos 8 caractéris para usuário -->

        <!-- input:password - para ocultar a senha, e aparecer com aquelas bolinhas  -->
      </p>
      <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
      </p>
    </form>
</body>
</html>
