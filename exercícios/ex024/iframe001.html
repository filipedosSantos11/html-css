<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px solid black;
            
            /* posso configurar o iframe com CSS é o que mais vale */
            /* dar pra configurar uma borda também  */
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do 

        <!-- Tamanho padrão do iframe width-300px e height-150px -->
                                            <!-- borda do iframe -->
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scrolling="no"> 

            <!-- scrolling 
             aceita valores como: auto(padrão), yes, no -->

             <!-- NO - é para não deixar rolar -->

             <!-- mas podemos também configurar altura para o iframe -->

           <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
        </iframe>

        <!-- dessa forma cria uma janela do site -->
        
        para aprender a programar.
    </p>

    <p>
        O repositório do Guanabara 

        <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="500" width="500">    
            <!-- a largura também posso configurar -->
            <a href="https://gustavoguanabara.github.io"> no GitHub</a>
        </iframe>

        <!-- entre o iframe coloca-se a mensagem, caso o site não seja compatível com iframe -->

        também é bem legal!
    </p>

    <p>
        O site do <iframe src="https://www.google.com.br" frameborder="0"></iframe> também é muito legal, pena que não funciona dentro do iframe!

        <!-- alguns sites tem uma proteção para que seu 
         conteúdo não seja exibido dentro de iframes -->
    </p>
</body>
</html>
