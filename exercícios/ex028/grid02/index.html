<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na Prática</title>
    <style>
        div.conteiner {
            border: 3px solid blue;
            display: grid;
            height: 250px;
            grid-template-columns: auto auto auto; /* três colunas automáticas */
            grid-template-rows: auto auto auto; /* três linhas automáticas */

            grid-template: repeat(3, auto) / repeat(3, auto); /* SHORTHAND - ROW, COLUMN, mas usando repeat */

            gap: 10px; /* espaçamento entre colunas ou linhas */

            align-items: stretch;
            justify-items: stretch;
            align-content: stretch;
            justify-content: stretch;

            place-items: stretch stretch; /* SHORTHAND align-items | justify-items */

            place-content: stretch stretch; /* SHORTHAND align-content | justify-content */

            /* ALIGN - sempre na vertical */
            /* JUSTIFY - sempre na horizontal */

            /* ITEMS: stretch, start, end, center */

            /* CONTENT: stretch, start, center, end, space-around, space-between, space-evenly */
        }

        div.item {
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
