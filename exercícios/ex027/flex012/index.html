<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplos</title>
    <style>
        div.conteiner {
            display: flex;
            background-color: lightsalmon;
            flex-flow: row nowrap;
            /* no CONTEINER temos que declarar DISPLAY: FLEX; 
            para que o conteiner entre em modo flexbox */
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
              /* para a largura do box */
        }

        /* FLEX-SHRINK - vai encolher ? */
        /* FLEX-GROW - vai crescer ? */

        div#cxA {
            flex-shrink: 0;       
            flex-grow: 1;
            flex-basis: 200px;

            flex: 1 0 200px; /* é o mesmo que flex-shrink: 0; flex-grow: 1; flex-basis: 200px; */
        }

        div#cxB {
            /* flex-shrink: 1;   
            flex-grow: 1;
            flex-basis: 150px; */

            flex: 1 1 150px; /* é o mesmo que flex-shrink: 1; flex-grow: 1; flex-basis: 150px; */
        }

        div#cxC {
            /* flex-shrink: 8;
            flex-grow: 1;
            flex-basis: auto; */

            flex: 1 8 auto; /* é o mesmo que flex-shrink: 8; flex-grow: 1; flex-basis: auto; */
        }

        /* FLEX: 0 1 AUTO; (padrão)
        é mesmo que dizer FLEX: INITIAL; */


        /* FLEX: 0 0 AUTO;
        é mesmo que dizer FLEX: NONE; = nada flexível */


        /* FLEX: 1 1 AUTO;
        é mesmo que dizer FLEX: AUTO; = o mais flexível */


        /* FLEX: 3; 
        é mesmo que dizer FLEX: 3 1 AUTO; = se eu não declarar valor, vai ser padrão */

    </style>
</head>
<body>
    <h2><ins>flex-basis</ins>+<ins>flex-grow</ins>+<ins>flex-shrink</ins></h2>

    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
