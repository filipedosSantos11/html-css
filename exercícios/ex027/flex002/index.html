<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-direction: row;

            /* no CONTEINER temos que declarar DISPLAY: FLEX; 
            para que o conteiner entre em modo flexbox */

            /* FLE-DIRECTION: ROW; - MAIN-AXIS na horizontal ----> */

            /* MAIN-START - na esquerda */
            /* MAIN-END - na direita */

            /* o CROSS AXIS - de CIMA para BAIXO */
            /* o CROSS-START - em CIMA */
            /* o CROSS-END - em BAIXO */

            /* FLEX-DIRECTION: ROW-REVERSE - MAIN-AXIS na hotizontal   <---- */

            /* MAIN-START - na direita */
            /* MAIN-END - na esquerda */

            /* CROSS-AXIS - na vertical */
            /* CROSS-STAR - em CIMA */
            /* CROSS-END - em BAIXO */

        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;

            /* para os elementos ITENS declaramos FLEX: AUTO; - para que os itens se adaptem ao tamanho do conteiner */
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>

    </div>
</body>
</html>
