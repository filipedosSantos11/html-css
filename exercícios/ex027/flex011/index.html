<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplos</title>
    <style>
        div.conteiner {
            display: flex;
            background-color: lightsalmon;
            flex-flow: row nowrap;
            /* no CONTEINER temos que declarar DISPLAY: FLEX; 
            para que o conteiner entre em modo flexbox */
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;  /* para a largura do box */
        }

        /* FLEX-SHRINK - vai encolher ? */
        /* FLEX-GROW - vai crescer ? */

        div#cxA {
            flex-shrink: 0;       
            flex-grow: 1;
        }

        div#cxB {
            flex-shrink: 1;   
            flex-grow: 1;
        }

        div#cxC {
            flex-shrink: 8;
            flex-grow: 1;
        }

    </style>
</head>
<body>
    <h2><ins>flex-basis</ins>+<ins>flex-grow</ins>+<ins>flex-shrink</ins></h2>

    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
