<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            display: flex;
            background-color: lightsalmon;
            flex-flow: row nowrap;

            /* no CONTEINER temos que declarar DISPLAY: FLEX; 
            para que o conteiner entre em modo flexbox */
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;

            /* FLEX-BASIS - para mexer na largura dos boxes que os items ocupam */
            /* nunca é uma medida certa */
            /* porque quando for diminuir a tela, o item vai se adaptando também */
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">outro conteúdo</div>
        <div class="item">C</div>
        <div class="item">conteúdo um pouco maior </div>
        <div class="item">E</div>
        <div class="item">conteúdo maior ainda que vai ocupar mais espaço</div>
        <div class="item">G</div>

    </div>
</body>
</html>
