<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            display: flex;
            background-color: lightsalmon;
            flex-flow: row wrap;
            align-items: flex-start;  /* no CROSS-AXIS */
            height: 400px;

            /* no CONTEINER temos que declarar DISPLAY: FLEX; 
            para que o conteiner entre em modo flexbox */
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 20px; 

            /* para os elementos ITENS declaramos FLEX: AUTO; - para que os itens se adaptem ao tamanho do conteiner */
        }

        /* ALIGN-SELF - só são aplicáveis a elementos FILHOS 
        e funcionam no CROSS-AXIS 
        com essa propriedade eu consigo configurar o comportamento individual de cada elemento filho */

        div#i1 {
           
        }

         div#i2 {
            align-self: auto;  
            /* dessa forma vai erdar a propriedade ALIGN-ITEMS do contêiner, neste caso o FLEX-START - se não for dessa forma vai ser STRETCH */
        }

         div#i3 {
            align-self: flex-end;
        }

         div#i4 {
            
        }

         div#i5 {
            align-self: center;
        }

         div#i6 {
            
        }

         div#i7 {
            align-self: stretch;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>

    </div>
</body>
</html>
